# Starship prompt configuration
# Docs: https://starship.rs/config/

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$python\
$node\
$ruby\
$rust\
$golang\
$cmd_duration\
$line_break\
$character"""

[character]
success_symbol = "[❯](bold green)"
error_symbol   = "[❯](bold red)"

[directory]
truncation_length = 4
truncate_to_repo  = true
style             = "bold blue"

[git_branch]
symbol = " "
style  = "bold purple"

[git_status]
ahead  = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
modified = "!${count}"
untracked = "?${count}"
staged   = "+${count}"

[python]
symbol = " "
format = '[$symbol($version )(\($virtualenv\) )]($style)'

[nodejs]
symbol = " "
format = '[$symbol($version )]($style)'

[cmd_duration]
min_time = 2000
format   = "took [$duration](bold yellow) "

[hostname]
ssh_only = true
format   = "[@$hostname](bold red) "
