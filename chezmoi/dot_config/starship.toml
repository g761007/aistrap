# Starship — P10k Agnoster style
# Layout: [time][user@host][python][ruby][node][path][git]
# Requires Nerd Font

# ── Left prompt ───────────────────────────────────────────────────────────────
# Language segments use custom modules so they always show regardless of
# which files are in the current directory.
format = """\
$time\
[](bg:#262626 fg:#111111)\
$username$hostname\
${custom.python_ver}\
${custom.ruby_ver}\
${custom.node_ver}\
[](bg:#303030 fg:#3E7C3E)\
$directory\
[](bg:#4B3882 fg:#303030)\
$git_branch\
$git_status\
[](fg:#4B3882)\
$line_break\
$character"""

# ── Time ──────────────────────────────────────────────────────────────────────
[time]
disabled    = false
time_format = "%H:%M:%S"
style       = "bg:#111111 fg:#9E9E9E"
format      = "[ $time ]($style)"

# ── Username / Hostname ───────────────────────────────────────────────────────
[username]
show_always = true
style_user  = "bg:#262626 fg:#E0E0E0"
style_root  = "bg:#CC342D fg:#FFFFFF bold"
format      = "[ $user]($style)"

[hostname]
ssh_only = false
style    = "bg:#262626 fg:#9E9E9E"
format   = "[@$hostname ]($style)"
trim_at  = "."

# ── Python (always show via custom module) ────────────────────────────────────
[custom.python_ver]
command = 'python3 -V 2>/dev/null | cut -d" " -f2'
format  = '[](bg:#FAAB2E fg:#262626)[ 🐍 $output ]($style)'
style   = "bg:#FAAB2E fg:#111111 bold"
when    = 'command -v python3 >/dev/null 2>&1'
shell   = ["bash", "--noprofile", "--norc"]

# ── Ruby (always show via custom module) ──────────────────────────────────────
[custom.ruby_ver]
command = 'ruby -v 2>/dev/null | awk "{print \$2}"'
format  = '[](bg:#CC342D fg:#FAAB2E)[ 💎 $output ]($style)'
style   = "bg:#CC342D fg:#FFFFFF bold"
when    = 'command -v ruby >/dev/null 2>&1'
shell   = ["bash", "--noprofile", "--norc"]

# ── Node.js (always show via custom module) ───────────────────────────────────
[custom.node_ver]
command = 'node -v 2>/dev/null | sed "s/v//"'
format  = '[](bg:#3E7C3E fg:#CC342D)[ $output ]($style)'
style   = "bg:#3E7C3E fg:#FFFFFF bold"
when    = 'command -v node >/dev/null 2>&1'
shell   = ["bash", "--noprofile", "--norc"]

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
style             = "bg:#303030 fg:#87D7FF bold"
format            = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo  = false
truncation_symbol = "…/"
home_symbol       = "~"
read_only         = " 󰌾"

# ── Git branch ────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style  = "bg:#4B3882 fg:#FFFFFF bold"
format = "[ $symbol$branch ]($style)"

# ── Git status ────────────────────────────────────────────────────────────────
[git_status]
style    = "bg:#4B3882 fg:#FFFFFF"
format   = "[$all_status$ahead_behind]($style)[ ]($style)"
ahead    = "⇡${count}"
behind   = "⇣${count}"
diverged = "⇕"
modified = "!${count}"
untracked = "?${count}"
staged   = "+${count}"
deleted  = "✘"
stashed  = "≡"

# ── Prompt character ──────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold #98C379)"
error_symbol   = "[❯](bold #E06C75)"
