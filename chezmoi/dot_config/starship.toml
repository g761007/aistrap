# Starship — Bullet Train style
# Layout: [time][user@host][python][ruby][node][path][git]
# Colors: terminal 256-color palette equivalents (high-saturation)

format = """\
$time\
[](bg:#3A3A3A fg:#262626)\
$username$hostname\
${custom.python_ver}\
${custom.ruby_ver}\
${custom.node_ver}\
[](bg:#0087AF fg:#005F87)\
$directory\
[](bg:#AFD700 fg:#0087AF)\
$git_branch\
$git_status\
[](fg:#AFD700)\
$line_break\
$character"""

# ── Time ──────────────────────────────────────────────────────────────────────
[time]
disabled    = false
time_format = "%H:%M:%S"
style       = "bg:#262626 fg:#FFFFFF"
format      = "[ $time ]($style)"

# ── User @ Host ───────────────────────────────────────────────────────────────
[username]
show_always = true
style_user  = "bg:#3A3A3A fg:#EEEEEE"
style_root  = "bg:#870000 fg:#FFFFFF bold"
format      = "[ $user]($style)"

[hostname]
ssh_only = false
style    = "bg:#3A3A3A fg:#DDDDDD"
format   = "[@$hostname ]($style)"
trim_at  = "."

# ── Python ────────────────────────────────────────────────────────────────────
[custom.python_ver]
command = 'python3 -V 2>/dev/null | cut -d" " -f2'
format  = '[](bg:#D7AF00 fg:#3A3A3A)[ 🐍 $output ]($style)'
style   = "bg:#D7AF00 fg:#1C1C1C bold"
when    = 'command -v python3 >/dev/null 2>&1'
shell   = ["bash", "--noprofile", "--norc"]

# ── Ruby ──────────────────────────────────────────────────────────────────────
[custom.ruby_ver]
command = 'ruby -v 2>/dev/null | awk "{print \$2}"'
format  = '[](bg:#870000 fg:#D7AF00)[ 💎 $output ]($style)'
style   = "bg:#870000 fg:#FFFFFF bold"
when    = 'command -v ruby >/dev/null 2>&1'
shell   = ["bash", "--noprofile", "--norc"]

# ── Node.js ───────────────────────────────────────────────────────────────────
[custom.node_ver]
command = 'node -v 2>/dev/null | sed "s/v//"'
format  = '[](bg:#005F87 fg:#870000)[  $output ]($style)'
style   = "bg:#005F87 fg:#FFFFFF bold"
when    = 'command -v node >/dev/null 2>&1'
shell   = ["bash", "--noprofile", "--norc"]

# ── Directory ─────────────────────────────────────────────────────────────────
[directory]
style             = "bg:#0087AF fg:#FFFFFF bold"
format            = "[ $path ]($style)"
truncation_length = 4
truncate_to_repo  = false
truncation_symbol = "…/"
home_symbol       = "~"
read_only         = " 󰌾"

# ── Git branch ────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style  = "bg:#AFD700 fg:#1C1C1C bold"
format = "[ $symbol$branch ]($style)"

# ── Git status ────────────────────────────────────────────────────────────────
[git_status]
style     = "bg:#AFD700 fg:#1C1C1C"
format    = "[$all_status$ahead_behind]($style)[ ]($style)"
ahead     = "⇡${count}"
behind    = "⇣${count}"
diverged  = "⇕"
modified  = "!${count}"
untracked = "?${count}"
staged    = "+${count}"
deleted   = "✘"
stashed   = "≡"

# ── Prompt character ──────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](bold #AFD700)"
error_symbol   = "[❯](bold #D70000)"
